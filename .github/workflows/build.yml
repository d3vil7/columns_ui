name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v3.5.0-artwork-fix.1"
        required: true
        type: string
      release_name:
        description: "Release name. Leave empty to use the tag."
        required: false
        type: string
      prerelease:
        description: "Mark this GitHub Release as a pre-release"
        required: true
        default: true
        type: boolean
      draft:
        description: "Create as draft release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-release:
    name: Build universal release package
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ runner.os }}-vcpkg-archives-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-archives-

      - name: Set up vcpkg
        shell: pwsh
        run: |
          git -C C:\vcpkg pull
          vcpkg version
          vcpkg integrate install

      - name: Build release package
        shell: pwsh
        env:
          FB2K_SYMBOL_STORE: ${{ github.workspace }}\symbol-store
        run: |
          New-Item -ItemType Directory -Force -Path $env:FB2K_SYMBOL_STORE | Out-Null
          py scripts\build-release-package.py

      - name: List release package output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse component-packages | Format-Table -AutoSize

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: columns-ui-release-package
          path: component-packages/*
          if-no-files-found: error

      - name: Create GitHub Release and upload package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: component-packages/*
